name: 用例质量检查

# 什么时候触发：推送到 main / 提 PR 时 / 手动点按钮
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check-test-cases:
    name: 校验测试用例格式
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: python -m pip install --quiet -r requirements-dev.txt

      - name: 检查 test_cases 下的用例
        run: python scripts/check_test_cases.py

      - name: 运行检查器自身的单元测试
        run: python -m pytest tests -q

      - name: 把结果写入构建摘要
        if: always()
        run: |
          echo "### 用例检查结果" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ 所有测试用例格式合规，检查器单测全部通过" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ 检查未通过，请看上面的日志定位具体是哪条用例" >> "$GITHUB_STEP_SUMMARY"
          fi
